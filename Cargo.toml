[workspace]
resolver = "2"
members = [
    "crates/humoco-sim-core",
    "crates/humoco-node",
    "crates/clap_complete",
]

[profile.dev]
debug = 1

# Optimize heavy cryptographic and hashing dependencies in dev and test profiles.
# Workspace crates remain unoptimized for rapid incremental compilation, while
# crypto primitives are compiled once with optimization and cached (15x-30x speedup).
[profile.dev.package.curve25519-dalek]
opt-level = 2
[profile.dev.package.ed25519-dalek]
opt-level = 2
[profile.dev.package.blake3]
opt-level = 2
[profile.dev.package.argon2]
opt-level = 2
[profile.dev.package.sha2]
opt-level = 2
[profile.dev.package.sha3]
opt-level = 2
[profile.dev.package.ring]
opt-level = 2

[profile.test]
debug = 1

[profile.test.package.curve25519-dalek]
opt-level = 2
[profile.test.package.ed25519-dalek]
opt-level = 2
[profile.test.package.blake3]
opt-level = 2
[profile.test.package.argon2]
opt-level = 2
[profile.test.package.sha2]
opt-level = 2
[profile.test.package.sha3]
opt-level = 2
[profile.test.package.ring]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1


