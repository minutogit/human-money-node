[package]
name = "humoco-node"
version = "0.1.3"
edition = "2021"
description = "Human Money Node (humoco-node) - Decentralized Collision Lock Registry Daemon"
license = "MIT"

[[bin]]
name = "humoco"
path = "src/main.rs"

[[bin]]
name = "cluster-sim"
path = "src/bin/cluster_sim.rs"

[dependencies]
humoco-sim-core = { path = "../humoco-sim-core" }
humoco-proto = { path = "../../../humoco-proto" }
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "sync", "time", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = { version = "4.5", path = "../clap_complete" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde", "pkcs8"] }
rand = "0.8"
directories = "5.0"
thiserror = "1.0"
redb = "2.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
bincode = "1.3"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
bytes = "1.7"
rustls-pki-types = "1"
axum = { version = "0.7", default-features = false, features = ["tokio", "http1", "json", "query"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
argon2 = "0.5"
hex = "0.4"
serde_json = "1.0"
sha3 = "0.10"
sha2 = "0.10"
bs58 = "0.5"
parking_lot = "0.12"
bip39 = { version = "2.1", default-features = false, features = ["rand"] }
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
cuckoofilter = "0.5"
mimalloc = { version = "0.1", default-features = false }
zeroize = "1.8"
tempfile = "3.10"
socket2 = "0.6"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

