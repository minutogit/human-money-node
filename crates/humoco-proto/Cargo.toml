[package]
name = "humoco-proto"
version = "0.1.0"
edition = "2021"
description = "Canonical wire protocol, DTOs, and zero-trust verifiers for HuMoCo Layer 2"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
blake3 = "1.5"
ed25519-dalek = { version = "2.1", default-features = false }
bincode = "1.3"

[dev-dependencies]
rand = "0.8"
