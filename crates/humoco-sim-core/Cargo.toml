[package]
name = "humoco-sim-core"
version = "0.1.3"
edition = "2021"
description = "Deterministic in-memory simulation core and executable specification for Human Money Node"
license = "MIT"

[dependencies]
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
ed25519-dalek = { version = "2.1", default-features = false }

[dev-dependencies]
proptest = "1"
