# ==============================================================================
# Human Money Node (humoco-node) - NGINX Reverse Proxy Configuration
# ==============================================================================

# Rate limiting zone: max 30 requests/second per client IP (burst up to 50)
limit_req_zone $binary_remote_addr zone=humoco_ingress_limit:10m rate=30r/s;

# Connection limit zone: max 20 concurrent TCP connections per IP
limit_conn_zone $binary_remote_addr zone=humoco_conn_limit:10m;

# Upstream HuMoCo Ingress REST API
upstream humoco_backend {
    # In Docker network: humoco-node:8080
    server humoco-node:8080;
    # For Bare-Metal / Systemd on same host:
    # server 127.0.0.1:8080;

    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # ACME challenge for Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    # SSL Certificates (managed by certbot or your certificate authority)
    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Compression
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 256;

    # Default payload size limit (Spec 10 & 13)
    client_max_body_size 64k;

    # Apply connection limits
    limit_conn humoco_conn_limit 20;

    # Proxy Headers configuration
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Proxy Timeouts matching PoS and node ingress requirements
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;

    # Client Ingress endpoints: /v1/lock, /v1/status, /v1/pow-challenge, /v1/node-status
    location / {
        limit_req zone=humoco_ingress_limit burst=50 nodelay;
        proxy_pass http://humoco_backend;
    }

    # Sync endpoint: Allow up to 1 MiB payload for batch sync
    location /v1/sync {
        client_max_body_size 1m;
        limit_req zone=humoco_ingress_limit burst=20 nodelay;
        proxy_pass http://humoco_backend;
    }

    # Prometheus metrics endpoint: optionally restrict to monitoring servers
    location /metrics {
        # allow 10.0.0.0/8;
        # allow 127.0.0.1;
        # deny all;
        proxy_pass http://humoco_backend;
    }
}
